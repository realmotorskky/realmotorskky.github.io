(function(){
 function addExtrudedLogo(){
  if(document.querySelector(".rm-logo-extruded"))return;
  var wrap=document.createElement("div");
  wrap.className="rm-logo-extruded";
  wrap.setAttribute("aria-hidden","true");
  for(var i=0;i<7;i++){
   var layer=document.createElement("img");
   layer.src="assets/real-motors-watermark.png";
   layer.alt="";
   layer.draggable=false;
   layer.className=i===6?"rm-logo-face":"rm-logo-side";
   layer.style.transform="translateZ("+(i*1.5)+"px)";
   wrap.appendChild(layer);
  }
  document.body.prepend(wrap);
 }
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",addExtrudedLogo,{once:true});
 else addExtrudedLogo();
})();
